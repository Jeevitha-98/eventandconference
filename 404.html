
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Error – 404 Node Coordinates Displaced</title>
    <link rel="stylesheet" href="404.css">
</head>
<body class="stackly-404-body">

    <!-- Ambient Space Background Canvas Glows -->
    <div class="error-canvas-glow-blob"></div>

    <div class="error-panel-matrix-container">
        <!-- Floating Schematic Vector Mesh Icon -->
        <div class="error-schematic-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>

        <!-- High-Contrast Analytical Text Readouts -->
        <span class="error-badge-tag">ROUTE EXCELLENCE BREAKPOINT</span>
        <h1 class="error-code-headline">404</h1>
        <h2 class="error-brief-title">Node Coordinates Displaced</h2>
        <p class="error-diagnostic-abstract">The execution request path you transmitted does not match any verified routing records inside Stackly's event framework network layers. The cluster registry might be undergoing hot-hydration compilation.</p>

        <!-- Command Action Buttons Row Stack -->
        <div class="error-actions-buttons-stack">
            <!-- Back Button: Triggers specialized history navigation context state queries -->
            <button class="error-action-trigger-btn btn-secondary-hollow" id="backToPreviousSectionTrigger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>Back to Operation</span>
            </button>
            
            <!-- Home Button: Standard target route navigation to homepage index asset -->
            <a href="index.html" class="error-action-trigger-btn btn-primary-peach">
                <span>Return to Home Base</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
        </div>
    </div>

   <style>
    /* Core Canvas Resets */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

.stackly-404-body {
    width: 100vw;
    min-height: 100vh;
    background-color: #0c0710; /* Corporate Deep Plum backdrop layout variables */
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px; /* Locked strict safety clearances padding limits mapping */
}

/* Backing Ambient Blur Blobs */
.error-canvas-glow-blob {
    position: absolute;
    width: 500px;
    height: 450px;
    background: radial-gradient(circle, rgba(255, 178, 148, 0.05) 0%, transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
}

/* Master Data Frame Panel Setup */
.error-panel-matrix-container {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 640px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: errorTerminalEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes errorTerminalEntrance {
    0% { opacity: 0; transform: translateY(20px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Schematic Outline Vectors */
.error-schematic-icon {
    width: 72px;
    height: 72px;
    color: rgba(255, 178, 148, 0.2); /* Soft phantom orange backing icon */
    margin-bottom: 2rem;
    animation: beaconPulse 2.5s ease-in-out infinite alternate;
}

.error-schematic-icon svg {
    width: 100%;
    height: 100%;
}

@keyframes beaconPulse {
    0% { transform: scale(1); color: rgba(255, 178, 148, 0.15); }
    100% { transform: scale(1.05); color: rgba(255, 178, 148, 0.3); }
}

.error-badge-tag {
    font-size: 0.72rem;
    font-weight: 800;
    color: #ffb294; /* Vivid Peach focus identity code accent token */
    background: rgba(255, 178, 148, 0.05);
    border: 1px solid rgba(255, 178, 148, 0.15);
    padding: 0.45rem 0.9rem;
    border-radius: 4px;
    letter-spacing: 0.08em;
    display: inline-block;
    margin-bottom: 1.5rem;
}

.error-code-headline {
    font-size: 8rem;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #ffffff 40%, #ffb294 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
}

.error-brief-title {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 1.25rem;
}

.error-diagnostic-abstract {
    font-size: 1.02rem;
    line-height: 1.6;
    color: #b5a4ba;
    margin-bottom: 3.5rem;
    max-width: 540px;
    transition: color 0.3s ease;
}

.error-diagnostic-abstract:hover {
    color: #ffffff;
}

/* Command Action Row Grouping Systems */
.error-actions-buttons-stack {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    width: 100%;
}

.error-action-trigger-btn {
    text-decoration: none;
    padding: 0.9rem 2.2rem;
    font-size: 0.98rem;
    font-weight: 700;
    border-radius: 30px; /* Smooth pill curve layout button configurations */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    font-family: inherit;
    box-sizing: border-box;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.error-action-trigger-btn svg {
    width: 14px;
    height: 14px;
    transition: transform 0.3s ease;
}

.btn-secondary-hollow {
    background-color: transparent;
    color: #ffffff;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
}

.btn-secondary-hollow:hover {
    border-color: rgba(255, 255, 255, 0.4);
    background-color: rgba(255, 255, 255, 0.02);
    transform: translateY(-2px);
}

.btn-secondary-hollow:hover svg {
    transform: translateX(-3px);
}

.btn-primary-peach {
    background-color: #ffb294;
    color: #211425;
    border: none;
}

.btn-primary-peach:hover {
    background-color: #ffffff;
    box-shadow: 0 6px 22px rgba(255, 255, 255, 0.35);
    transform: translateY(-2px);
}

.btn-primary-peach:hover svg {
    transform: translateY(-1px) scale(1.05);
}

/* Fluid Responsive Matrix Adaptations Constraints (Strict 20px Clearance) */
@media (max-width: 600px) {
    .stackly-404-body { padding: 40px 20px 20px 20px; } /* Safety boundaries mapping preserved */
    .error-code-headline { font-size: 5.5rem; }
    .error-brief-title { font-size: 1.5rem; }
    .error-diagnostic-abstract { font-size: 0.94rem; margin-bottom: 2.5rem; }
    .error-actions-buttons-stack { flex-direction: column; gap: 0.8rem; }
    .error-action-trigger-btn { width: 100%; text-align: center; } /* Extends items to span full mobile rows grids width */
}

   </style>

   <script>
    document.addEventListener("DOMContentLoaded", () => {
    const backBtn = document.getElementById("backToPreviousSectionTrigger");

    if (backBtn) {
        backBtn.addEventListener("click", () => {
            // Evaluates history stack length coordinates natively
            if (document.referrer !== "") {
                // Returns user explicitly to exact previous page context and identical viewport section hash location tracking
                window.location.href = document.referrer;
            } else {
                // Fail-safe router fallback option: pops browser back 1 stack step if cross-origin reference limits apply
                window.history.back();
            }
        });
    }
});

   </script>
</body>
</html>
